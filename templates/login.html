{% extends "base.html" %}
{% block title %}Log in or create account{% endblock %}
{% block content %}
<section class="section auth-section"><div class="container auth-wrap">
  <div class="card auth-card" id="auth-root" data-next="{{ next_url }}" data-start="{{ start_tab }}">
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" data-tab="login" role="tab">Log in</button>
      <button class="auth-tab" data-tab="register" role="tab">Create account</button>
    </div>

    <form id="login-form" class="auth-form" novalidate>
      <h2>Welcome back</h2>
      <label class="field">Email<input name="email" type="email" autocomplete="email" required></label>
      <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>

    <form id="register-form" class="auth-form" novalidate hidden>
      <h2>Create your free account</h2>
      <label class="field">Full name<input name="name" type="text" autocomplete="name" maxlength="80" required></label>
      <label class="field">Email<input name="email" type="email" autocomplete="email" required></label>
      <label class="field">Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <small class="muted">At least 8 characters with a letter and a number.</small></label>
      <label class="field">Confirm password<input name="confirm" type="password" autocomplete="new-password" required></label>
      <p class="form-error" id="register-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>

    <p class="muted small center">Prefer not to sign in? <a href="/dashboard">Continue as guest</a>. Passwords are stored as secure hashes, never as plain text.</p>
  </div>
</div></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
