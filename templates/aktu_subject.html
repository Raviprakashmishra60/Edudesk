{% extends "base.html" %}
{% block title %}{{ subject_name }} (AKTU){% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/aktu.css') }}">{% endblock %}
{% block content %}
<section class="page-hero"><div class="container" id="subject-root" data-code="{{ subject_code }}">
  <a class="small" href="/aktu">← All AKTU subjects</a>
  <h1 id="subject-title">{{ subject_name }}</h1>
  <div id="subject-meta" class="tags"></div>
  <p id="subject-objective" class="lead"></p>
  <div id="subject-note"></div>
</div></section>
<section class="section"><div class="container">
  <div id="subject-body"><div class="skeleton" style="height:260px"></div></div>
</div></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/aktu_subject.js') }}"></script>{% endblock %}
